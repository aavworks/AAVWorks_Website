<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" fill="none">
  <!-- Dynamic Ribbon Icon -->
  <g transform="translate(4, 12)">
    <!-- First Red Stroke -->
    <polygon points="0,38 13,0 24,0 11,38" fill="#EF4444" />
    <polygon points="11,38 13,0 18,0 14,38" fill="#991B1B" opacity="0.3" />
    
    <!-- Yellow Inverted Stroke -->
    <polygon points="13,0 24,0 35,38 24,38" fill="#FBBF24" />
    <polygon points="22,0 24,0 35,38 31,38" fill="#D97706" opacity="0.3" />
    
    <!-- Middle Green Upward Stroke -->
    <polygon points="24,38 35,38 46,0 35,0" fill="#34D399" />
    
    <!-- Red Downward Stroke -->
    <polygon points="35,0 46,0 57,38 46,38" fill="#F87171" />
    <polygon points="44,0 46,0 57,38 53,38" fill="#991B1B" opacity="0.3" />
    
    <!-- Final Green Upward Stroke -->
    <polygon points="46,38 57,38 68,0 57,0" fill="#10B981" />
  </g>

  <!-- Typography -->
  <text x="82" y="27" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">
    AAV WORKS
  </text>
  <text x="83" y="42" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#94A3B8" letter-spacing="0.22em">
    PRIVATE LIMITED
  </text>
  <text x="83" y="53" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="6.5" font-weight="600" fill="#F87171" letter-spacing="0.14em">
    RAILWAY S&amp;T DESIGN &amp; DRAWINGS
  </text>
</svg>
