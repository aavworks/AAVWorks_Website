<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 38" fill="none">
  <!-- Dynamic Ribbon Icon -->
  <g>
    <!-- First Red Stroke -->
    <polygon points="0,38 13,0 24,0 11,38" fill="#C2122F" />
    <polygon points="11,38 13,0 18,0 14,38" fill="#991B1B" opacity="0.25" />
    
    <!-- Yellow Inverted Stroke -->
    <polygon points="13,0 24,0 35,38 24,38" fill="#F59E0B" />
    <polygon points="22,0 24,0 35,38 31,38" fill="#D97706" opacity="0.3" />
    
    <!-- Middle Green Upward Stroke -->
    <polygon points="24,38 35,38 46,0 35,0" fill="#10B981" />
    
    <!-- Red Downward Stroke -->
    <polygon points="35,0 46,0 57,38 46,38" fill="#E53935" />
    <polygon points="44,0 46,0 57,38 53,38" fill="#991B1B" opacity="0.3" />
    
    <!-- Final Green Upward Stroke -->
    <polygon points="46,38 57,38 68,0 57,0" fill="#059669" />
  </g>

  <!-- Typography -->
  <text x="78" y="21" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0F172A" letter-spacing="-0.02em">AAV WORKS</text>
  <text x="79" y="34" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="8.8" font-weight="700" fill="#64748B" letter-spacing="0.2em">PRIVATE LIMITED</text>
</svg>
